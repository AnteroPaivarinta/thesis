version: '3.1'
services:
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: salasana
      MYSQL_DATABASE: app_database
      MYSQL_USER: user
      MYSQL_PASSWORD: pw
    ports:
      - "3307:3306"
    volumes:
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: