name: oppari

on:
  push:
    branches:
      - main

jobs:
  oppari:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
         npm install
      - name: Build
        run: |
         npm run Build
      - name: Test
        run: |
         npm test