name: oppari

on:
  push:
    branches:
      - main

jobs:
  oppari:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: node --experimental-vm-modules ./node_modules/jest/bin/jest.js
